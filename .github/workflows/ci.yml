name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            - run: bun install --frozen-lockfile
            - run: bun run check
            - run: bun run test
            - run: bun run build
