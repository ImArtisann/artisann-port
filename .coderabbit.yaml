# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US
early_access: false

reviews:
    profile: assertive
    high_level_summary: true
    review_status: true
    auto_review:
        enabled: true
        auto_incremental_review: true
        drafts: false
    path_filters:
        - "!bun.lock"
        - "!**/dist/**"
        - "!**/.output/**"
        - "!**/.alchemy/**"
        - "!**/.wrangler/**"
        - "!tools/oxlint/**"
        - "!packages/assets/src/manifest.gen.ts"
        - "!packages/assets/.alchemy/**"
        - "!apps/web/.astro/**"
        - "!apps/web/dist/**"
        - "!apps/web/.alchemy/**"
        - "!apps/jakes-cats/src/routeTree.gen.ts"
        - "!apps/jakes-cats/.tanstack/**"
        - "!apps/jakes-cats/.output/**"
        - "!apps/jakes-cats/.alchemy/**"
    tools:
        biome:
            enabled: false
        eslint:
            enabled: false
        github-checks:
            enabled: true
    path_instructions:
        - path: "**"
          instructions: >-
              The root vite.config.ts is the sole lint/format authority for this
              repo (vite-plus). CI runs `bun run check`, which runs Astro check
              then `vp check` (type-aware Oxlint plus Effect and local plugins).
              `bun run lint` is `vp lint` and `bun run format` is `vp fmt`. Do not
              suggest Biome or ESLint configs, including to resolve Tailwind
              syntax; rely on the GitHub Checks results from the real toolchain.

chat:
    auto_reply: true
